<!DOCTYPE html>
<html lang="ru">
<head><script src="https://telegram.org/js/telegram-web-app.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>МАГАЗИН СОВЫ</title>
<style>
:root{--bg:#eaf2ff;--bg2:#fdeff2;--card:rgba(255,255,255,.78);--tx:#101a33;--mu:#5d6985;--bd:rgba(16,26,51,.1);--ac:#e8294b;--gold:#c98a00;--ok:#1a9d5c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1128;--bg2:#2a0f24;--card:rgba(255,255,255,.07);--tx:#f2f5ff;--mu:#9aa6c4;--bd:rgba(255,255,255,.12);--gold:#ffd166}}
:root[data-theme="dark"]{--bg:#0a1128;--bg2:#2a0f24;--card:rgba(255,255,255,.07);--tx:#f2f5ff;--mu:#9aa6c4;--bd:rgba(255,255,255,.12);--gold:#ffd166}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--tx);font-family:-apple-system,"SF Pro Display",Segoe UI,Roboto,sans-serif;background:linear-gradient(170deg,var(--bg),var(--bg2)) fixed;padding-bottom:110px}
#snow{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
#snow i{position:absolute;top:-10px;color:#fff;opacity:.8;animation:f linear infinite;text-shadow:0 0 4px rgba(120,160,255,.6)}
@keyframes f{to{transform:translateY(110vh) translateX(30px)}}
#owl,#owl2{position:fixed;top:20%;left:-140px;width:110px;z-index:0;pointer-events:none;animation:fly 18s linear infinite,bob 2.4s ease-in-out infinite;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
@keyframes fly{from{left:-140px}to{left:calc(100% + 30px)}}
@keyframes bob{50%{margin-top:-26px}}
.wl,.wr{transform-box:fill-box;animation:flap .45s ease-in-out infinite alternate}
.wl{transform-origin:100% 20%}.wr{transform-origin:0% 20%;animation-name:flapr}
@keyframes flap{from{transform:rotate(-8deg) scaleY(1)}to{transform:rotate(14deg) scaleY(.6)}}
@keyframes flapr{from{transform:rotate(8deg) scaleY(1)}to{transform:rotate(-14deg) scaleY(.6)}}
.hero .big{animation:sway 3s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes sway{to{transform:rotate(7deg)}}
.add{transition:transform .15s,background .2s}.add:active{transform:scale(.88)}
.add.pop{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.25) rotate(-4deg)}70%{transform:scale(.95)}}
.chip{transition:transform .15s}.chip:active{transform:scale(.88)}.chip.on{animation:pop .4s}
.card.enter{animation:enter .55s cubic-bezier(.2,.9,.3,1) both}
@keyframes enter{from{opacity:0;transform:translateY(28px) scale(.96)}}
#cartbar.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.07) translateY(-5px)}}
#cartbar:active{transform:scale(.97)}
.p{position:fixed;z-index:20;pointer-events:none;font-size:18px;animation:burst .85s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.4) rotate(240deg);opacity:0}}
.pane{animation:up .35s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}}
@media (prefers-reduced-motion:reduce){#snow,#owl,#owl2{display:none}}
main{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:0 16px}
.garland{display:flex;justify-content:space-around;padding-top:6px;font-size:18px}
.garland span{animation:b 1.6s ease-in-out infinite alternate}
.garland span:nth-child(2n){animation-delay:.4s}.garland span:nth-child(3n){animation-delay:.9s}
@keyframes b{from{opacity:.35;transform:scale(.9)}to{opacity:1;transform:scale(1.15)}}
.hero{margin:10px 0 16px;padding:20px;border-radius:24px;background:linear-gradient(135deg,#e8294b,#8a1cff 70%);color:#fff;position:relative;overflow:hidden}
.hero h1{margin:0 0 6px;font-size:26px;line-height:1.1}
.hero p{margin:0;opacity:.9;font-size:14px}
.hero .big{position:absolute;right:-6px;bottom:-14px;font-size:88px;opacity:.9}
.cd{display:inline-block;margin-top:12px;background:rgba(255,255,255,.2);backdrop-filter:blur(8px);border-radius:12px;padding:6px 12px;font-weight:700;font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chip{flex:0 0 auto;border:1px solid var(--bd);background:var(--card);backdrop-filter:blur(10px);color:var(--tx);padding:9px 14px;border-radius:20px;font-size:14px;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.bar{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font-size:13px;margin:4px 2px 10px}
.bar button{border:0;background:none;color:var(--ac);font-weight:600;font-size:13px;cursor:pointer}
.card{background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:20px;padding:14px;margin-bottom:12px}
.top{display:flex;gap:12px;align-items:center}
.av{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:26px;background:linear-gradient(135deg,#ffd166,#ff8a5b)}
.top .m{flex:1}.top b{font-size:16px}.top small{display:block;color:var(--mu);margin-top:2px}
.price{font-size:20px;font-weight:800}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.tag{font-size:12px;padding:4px 9px;border-radius:10px;background:var(--bd)}
.tag.g{color:var(--ok)}.tag.s{color:var(--gold)}
.row{display:flex;justify-content:space-between;align-items:center}
.old{color:var(--mu);text-decoration:line-through;font-size:13px;margin-right:6px;font-weight:400}
.add{border:0;border-radius:14px;padding:11px 18px;background:var(--ac);color:#fff;font-weight:700;font-size:14px;cursor:pointer}
.add.in{background:var(--bd);color:var(--tx)}
#cartbar{position:fixed;z-index:5;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;display:none;justify-content:space-between;align-items:center;border:0;border-radius:18px;padding:16px 20px;background:linear-gradient(135deg,#e8294b,#8a1cff);color:#fff;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 10px 30px rgba(138,28,255,.4)}
#sheet{position:fixed;inset:0;z-index:10;display:none;background:rgba(0,0,0,.5)}
#sheet.on{display:block}
.pane{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:85vh;overflow:auto;background:var(--bg);color:var(--tx);border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.pane h2{margin:0 0 12px}
.it{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
.it button{border:0;background:none;color:var(--ac);font-size:20px;cursor:pointer}
.promo{display:flex;gap:8px;margin:14px 0}
.promo input{flex:1;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px}
.promo button{border:0;border-radius:12px;padding:0 16px;background:var(--gold);color:#222;font-weight:700;cursor:pointer}
.sum{display:flex;justify-content:space-between;font-size:18px;font-weight:800;margin-bottom:12px}
.msg{color:var(--mu);font-size:13px;min-height:18px}
.empty{text-align:center;color:var(--mu);padding:30px 0}
footer{text-align:center;color:var(--mu);font-size:12px;padding:10px 0 20px}
</style>
</head>
<body>
<div id="snow"></div>
<div id="owl"><svg viewBox="-12 -12 144 112" xmlns="http://www.w3.org/2000/svg"><path class="wl" d="M32 45C6 35-6 62 8 80 18 72 28 64 34 58Z" fill="#6b4a2f"/><path class="wr" d="M88 45c26-10 38 17 24 35-10-8-20-16-26-22Z" fill="#6b4a2f"/><ellipse cx="60" cy="55" rx="32" ry="36" fill="#8b5e3c"/><ellipse cx="60" cy="66" rx="20" ry="24" fill="#ecd3ab"/><path d="M34 26 42 42 27 40ZM86 26 78 42 93 40Z" fill="#6b4a2f"/><circle cx="47" cy="43" r="12" fill="#fff"/><circle cx="73" cy="43" r="12" fill="#fff"/><circle cx="48" cy="44" r="6" fill="#1a1a2e"/><circle cx="72" cy="44" r="6" fill="#1a1a2e"/><circle cx="50" cy="42" r="2" fill="#fff"/><circle cx="74" cy="42" r="2" fill="#fff"/><path d="M60 50 54 60h12Z" fill="#ffb703"/><path d="M36 28Q58-14 86 22Q62 14 36 28Z" fill="#e8294b"/><ellipse cx="60" cy="26" rx="27" ry="5" fill="#fff"/><circle cx="86" cy="20" r="5" fill="#fff"/><path d="M48 90v6M72 90v6" stroke="#ffb703" stroke-width="4" stroke-linecap="round"/></svg></div>
<main>
 <div class="garland" id="gl"></div>
 <section class="hero">
  <h1>🦉 МАГАЗИН СОВЫ</h1>
  <p>Новогодняя распродажа аккаунтов ❄️ Промокод <b>NY2027</b> даёт −10%</p>
  <span class="cd" id="cd"></span>
  <div class="big">🎄</div>
 </section>
 <div class="chips" id="chips"></div>
 <div class="bar"><span id="cnt"></span><button id="sort">Сначала дешёвые ↑</button></div>
 <div id="list"></div>
 <footer>Уникальные аккаунты, один покупатель на аккаунт<br>Выдача после оплаты в Telegram</footer>
</main>
<button id="cartbar"></button>
<div id="sheet"><div class="pane" id="pane"></div></div>
<script>
const MANAGER='HA_COBE'; // ← ник менеджера в Telegram без @
const PROMO={NY2027:10};
const CATS=[['all','Все'],['new','Новые'],['rev','С отзывами'],['old','Старые'],['biz','Магазины']];
const ICON={new:'🎁',rev:'⭐',old:'🕰️',biz:'🏬'};
const ACC=[
 {id:'Начало',t:'new',y:2026,rv:0,rt:0,p:750,d:'Свежий аккаунт, подтвержден по паспорту'},
 {id:'Легкое начало',t:'new',y:2026,rv:0,rt:0,p:1500,d:'Чистая история, без ограничений'},
 {id:'Профи',t:'rev',y:2025,rv:7,rt:5.0,p:2000,d:'7 отзывов, рейтинг 5.0'},
 {id:'Мажорчик',t:'rev',y:2024,rv:23,rt:4.9,p:2990,d:'23 отзыва, активные объявления'},
 {id:'Изи профит',t:'old',y:2021,rv:12,rt:4.8,p:4990,d:'Регистрация 2021, прогретый'},
 {id:'гретый',t:'old',y:2019,rv:41,rt:4.9,p:6990,d:'Живая история с 2019 года'},
 {id:'ИП/ООО',t:'biz',y:2023,rv:58,rt:4.9,p:8990,d:'Профиль магазина, 58 отзывов'},
 {id:'Действующий магазин',t:'biz',y:2022,rv:112,rt:5.0,p:14990,d:'Магазин с высоким рейтингом'},
 {id:'изи лиды',t:'rev',y:2023,rv:15,rt:4.7,p:2290,d:'15 отзывов, подходит для старта'},
 {id:'попробовать',t:'new',y:2026,rv:1,rt:5.0,p:500,d:'Один отзыв, свежая регистрация'}];
const KEY='ny_shop_v1';
let cat='all',asc=true,cart=[],disc=0,enter=true;
try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(x))cart=x}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(cart))}catch(e){}};
const tg=window.Telegram&&window.Telegram.WebApp;
if(tg){try{tg.ready();tg.expand()}catch(e){}}
const buzz=()=>{try{tg&&tg.HapticFeedback.impactOccurred('light')}catch(e){}};
const $=id=>document.getElementById(id);
const fmt=n=>n.toLocaleString('ru-RU')+' ₽';
const total=()=>cart.reduce((s,id)=>s+ACC.find(a=>a.id===id).p,0);

// atmosphere
$('snow').innerHTML=Array.from({length:36},()=>`<i style="left:${Math.random()*100}%;font-size:${8+Math.random()*12}px;animation-duration:${6+Math.random()*9}s;animation-delay:-${Math.random()*12}s">❄</i>`).join('');
$('gl').innerHTML=['🔴','🟡','🔵','🟢','🔴','🟡','🔵','🟢','🔴','🟡'].map(c=>`<span>${c}</span>`).join('');
const days=Math.max(0,Math.ceil((new Date(2027,0,1)-Date.now())/864e5));
$('cd').textContent=days>0?`До Нового года: ${days} дн.`:'С Новым годом! 🎉';

function render(){
 $('chips').innerHTML=CATS.map(c=>`<button class="chip ${cat===c[0]?'on':''}" data-c="${c[0]}">${c[1]}</button>`).join('');
 const L=ACC.filter(a=>cat==='all'||a.t===cat).sort((a,b)=>asc?a.p-b.p:b.p-a.p);
 $('cnt').textContent=`Найдено: ${L.length}`;
 $('sort').textContent=asc?'Сначала дешёвые ↑':'Сначала дорогие ↓';
 $('list').innerHTML=L.map((a,i)=>{
  const inC=cart.includes(a.id);
  return `<div class="card${enter?' enter':''}" style="animation-delay:${i*70}ms"><div class="top"><div class="av">${ICON[a.t]}</div><div class="m"><b>Аккаунт ${a.id}</b><small>${a.d}</small></div></div>
  <div class="tags"><span class="tag">📅 с ${a.y} г.</span><span class="tag g">✔ Телефон</span>${a.rv?`<span class="tag s">⭐ ${a.rt} · ${a.rv} отз.</span>`:'<span class="tag">Без отзывов</span>'}</div>
  <div class="row"><div class="price">${fmt(a.p)}</div><button class="add ${inC?'in':''}" data-id="${a.id}">${inC?'В корзине ✓':'В корзину'}</button></div></div>`}).join('');
 const n=cart.length;
 $('cartbar').style.display=n?'flex':'none';
 $('cartbar').innerHTML=`<span>🛒 Корзина · ${n}</span><span>${fmt(total())}</span>`;
 save();enter=false;
}
function burst(x,y,em){for(let k=0;k<14;k++){const s=document.createElement('span');s.className='p';s.textContent=em[k%em.length];const a=Math.random()*6.28,d=50+Math.random()*80;s.style.cssText=`left:${x}px;top:${y}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d-30}px`;document.body.appendChild(s);setTimeout(()=>s.remove(),900)}}
function bump(id){const b=document.querySelector(`.add[data-id="${id}"]`);if(b)b.classList.add('pop');const c=$('cartbar');c.classList.remove('bump');void c.offsetWidth;c.classList.add('bump')}
function sheet(){
 const T=total(),D=Math.round(T*disc/100);
 $('pane').innerHTML=`<h2>Корзина 🎅</h2>`+(cart.length?cart.map(id=>{const a=ACC.find(x=>x.id===id);return `<div class="it"><span>Аккаунт ${a.id}<br><small style="color:var(--mu)">${fmt(a.p)}</small></span><button data-rm="${id}">✕</button></div>`}).join('')+
 `<div class="promo"><input id="pi" placeholder="Промокод"><button id="pa">OK</button></div><div class="msg" id="pm">${disc?`Скидка ${disc}% применена`:''}</div>
 <div class="sum"><span>Итого</span><span>${fmt(T-D)}</span></div><button class="add" id="go" style="width:100%;padding:16px;font-size:16px">Оформить в Telegram</button>`:'<div class="empty">Пока пусто. Загляни в каталог 🎁</div>');
}
function checkout(){
 const T=total(),D=Math.round(T*disc/100);
 const txt='Привет! Хочу оформить заказ:\n'+cart.map(id=>`• Аккаунт ${id} — ${fmt(ACC.find(a=>a.id===id).p)}`).join('\n')+`\nИтого: ${fmt(T-D)}`+(disc?` (промокод −${disc}%)`:'');
 const url=`https://t.me/${MANAGER}?text=${encodeURIComponent(txt)}`;
 try{tg?tg.openTelegramLink(url):window.open(url,'_blank')}catch(e){}
 try{navigator.clipboard.writeText(txt)}catch(e){}
}
document.addEventListener('click',e=>{
 const t=e.target;
 if(t.dataset.c){cat=t.dataset.c;enter=true;buzz();render()}
 else if(t.id==='sort'){asc=!asc;enter=true;buzz();render()}
 else if(t.dataset.id){const i=cart.indexOf(t.dataset.id),r=t.getBoundingClientRect();if(i<0){cart.push(t.dataset.id);burst(r.left+r.width/2,r.top+r.height/2,['❄️','⭐','🎁','✨'])}else cart.splice(i,1);buzz();render();bump(t.dataset.id)}
 else if(t.closest('#cartbar')){sheet();$('sheet').classList.add('on')}
 else if(t.id==='sheet'){$('sheet').classList.remove('on')}
 else if(t.dataset.rm){cart=cart.filter(x=>x!==t.dataset.rm);render();sheet()}
 else if(t.id==='pa'){const c=$('pi').value.trim().toUpperCase();disc=PROMO[c]||0;sheet();if(disc)burst(innerWidth/2,innerHeight*.55,['🎉','🎊','⭐','❄️','🦉']);$('pm').textContent=disc?`Скидка ${disc}% применена 🎉`:'Промокод не найден'}
 else if(t.id==='go'){burst(innerWidth/2,innerHeight*.75,['🎉','🎁','❄️','🦉']);checkout()}
});
{const o=$('owl').cloneNode(true);o.id='owl2';o.style.cssText='top:58%;width:72px;opacity:.7;animation-duration:27s,3s;animation-delay:-10s,0s';document.body.appendChild(o)}
render();
</script>
</body>
</html>

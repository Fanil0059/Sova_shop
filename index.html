<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>МАГАЗИН СОВЫ</title>
<style>
:root{--bg:#04060c;--bg2:#0a1530;--card:rgba(255,255,255,.045);--tx:#e9eefb;--mu:#8793ad;--bd:rgba(130,160,230,.16);--ac:#2f6bff;--gold:#c9a45c;--ok:#4ac9a0;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--tx);font-family:-apple-system,"SF Pro Display",Segoe UI,Roboto,sans-serif;background:linear-gradient(170deg,var(--bg),var(--bg2)) fixed;padding-bottom:110px}
.add{transition:transform .15s,background .2s}.add:active{transform:scale(.88)}
.add.pop{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.25) rotate(-4deg)}70%{transform:scale(.95)}}
.chip{transition:transform .15s}.chip:active{transform:scale(.88)}.chip.on{animation:pop .4s}
.card.enter{animation:enter .55s cubic-bezier(.2,.9,.3,1) both}
@keyframes enter{from{opacity:0;transform:translateY(28px) scale(.96)}}
#cartbar.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.07) translateY(-5px)}}
#cartbar:active{transform:scale(.97)}
.p{position:fixed;z-index:20;pointer-events:none;font-size:16px;color:#6f9bff;animation:burst .85s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.4) rotate(240deg);opacity:0}}
.pane{animation:up .35s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}}
main{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:0 16px}
.hero{margin:18px 0 16px;padding:26px 22px;border-radius:22px;background:linear-gradient(135deg,#0a1a44,#0d2a73 55%,#050a1c);border:1px solid rgba(130,160,230,.28);box-shadow:0 20px 50px rgba(20,60,200,.22),inset 0 1px 0 rgba(255,255,255,.08);color:#fff;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(70,120,255,.35),transparent 70%)}
.hero h1{margin:0 0 8px;font-size:24px;line-height:1.1;letter-spacing:.14em;font-weight:800}
.hero p{margin:0;opacity:.9;font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chip{flex:0 0 auto;border:1px solid var(--bd);background:var(--card);backdrop-filter:blur(10px);color:var(--tx);padding:9px 14px;border-radius:20px;font-size:14px;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.bar{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font-size:13px;margin:4px 2px 10px}
.bar button{border:0;background:none;color:var(--ac);font-weight:600;font-size:13px;cursor:pointer}
.card{background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02));backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:20px;padding:14px;margin-bottom:12px}
.top{display:flex;gap:12px;align-items:center}
.av{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:22px;color:#9db8ff;background:linear-gradient(135deg,#10234f,#0a1330);border:1px solid var(--bd)}
.top .m{flex:1}.top b{font-size:16px}.top small{display:block;color:var(--mu);margin-top:2px}
.price{font-size:20px;font-weight:800}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.tag{font-size:12px;padding:4px 9px;border-radius:10px;background:var(--bd)}
.tag.g{color:var(--ok)}.tag.s{color:var(--gold)}
.row{display:flex;justify-content:space-between;align-items:center}
.old{color:var(--mu);text-decoration:line-through;font-size:13px;margin-right:6px;font-weight:400}
.add{border:0;border-radius:14px;padding:11px 18px;background:var(--ac);color:#fff;font-weight:700;font-size:14px;cursor:pointer}
.add.in{background:var(--bd);color:var(--tx)}
#cartbar{position:fixed;z-index:5;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;display:none;justify-content:space-between;align-items:center;border:0;border-radius:18px;padding:16px 20px;background:linear-gradient(135deg,#1d4fd8,#0a1f5c);border:1px solid rgba(130,160,230,.35);color:#fff;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 10px 30px rgba(20,60,200,.4)}
#sheet{position:fixed;inset:0;z-index:10;display:none;background:rgba(0,0,0,.5)}
#sheet.on{display:block}
.pane{border-top:1px solid var(--bd);position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:85vh;overflow:auto;background:var(--bg);color:var(--tx);border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.pane h2{margin:0 0 12px}
.it{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
.it button{border:0;background:none;color:var(--ac);font-size:20px;cursor:pointer}
.promo{display:flex;gap:8px;margin:14px 0}
.promo input{flex:1;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px}
.promo button{border:0;border-radius:12px;padding:0 16px;background:var(--gold);color:#111;font-weight:700;cursor:pointer}
.sum{display:flex;justify-content:space-between;font-size:18px;font-weight:800;margin-bottom:12px}
.msg{color:var(--mu);font-size:13px;min-height:18px}
.empty{text-align:center;color:var(--mu);padding:30px 0}
.tabs{display:flex;gap:6px;padding:4px;margin:0 0 12px;border-radius:16px;background:var(--card);border:1px solid var(--bd);backdrop-filter:blur(10px)}
.tabs button{flex:1;border:0;background:none;color:var(--mu);padding:11px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;transition:background .2s,color .2s,transform .15s}
.tabs button:active{transform:scale(.95)}
.tabs button.on{background:var(--ac);color:#fff}
#cardsView{display:none}
.bcw{margin:0 0 26px;perspective:900px;opacity:0;transform:translateY(60px) scale(.9);transition:opacity .6s,transform .7s cubic-bezier(.2,.9,.3,1)}
.bcw.in{opacity:1;transform:none}
.bc{position:relative;aspect-ratio:1.586;border-radius:22px;padding:20px;color:#fff;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 18px 40px rgba(0,0,0,.55);will-change:transform;transition:transform .12s linear}
.bc::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--sx,50%) var(--sy,0%),rgba(120,160,255,.28),transparent 55%);pointer-events:none}
.bc::after{content:"";position:absolute;right:-60px;bottom:-80px;width:220px;height:220px;border-radius:50%;background:rgba(70,120,255,.1)}
.bc .l{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.bc .nm{font-size:26px;font-weight:900;letter-spacing:.04em}
.bc .chip2{width:42px;height:32px;border-radius:7px;background:linear-gradient(135deg,#d9bd7c,#8f6f2c);opacity:.95}
.bc .num{font-size:18px;letter-spacing:.14em;font-weight:600;position:relative;z-index:1;opacity:.92}
.bc .ft{display:flex;justify-content:space-between;font-size:12px;opacity:.85;position:relative;z-index:1}
.bc{background:var(--bg1,#0d1f4d)}
.bc .nm::before{display:none}
.kaspi{background:linear-gradient(135deg,#f14635,#ff7a45 120%)}
.home{background:linear-gradient(135deg,#e30613,#4a0408)}
.halyk{background:linear-gradient(135deg,#0a8f4a,#05481f);box-shadow:0 18px 40px rgba(0,0,0,.55),inset 0 -40px 60px rgba(255,214,0,.12)}
.sber{background:linear-gradient(135deg,#21a038,#0a5c1f)}
.tink{background:linear-gradient(135deg,#ffdd2d,#f2b800);color:#111}
.ozon{background:linear-gradient(135deg,#005bff,#2a1a8f)}
.alfa{background:linear-gradient(135deg,#ef3124,#6e0c08 85%)}
.alif{background:linear-gradient(135deg,#12b394,#06594a)}
.esh{background:linear-gradient(135deg,#0b2f7a,#d9531e 160%)}
.mtb{background:linear-gradient(135deg,#6a47ff,#241470)}
.mil{background:linear-gradient(135deg,#d4106a,#5c0830)}
.pko{background:linear-gradient(135deg,#0a3f8f,#021a45);box-shadow:0 18px 40px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.1)}
.san{background:linear-gradient(135deg,#ec0000,#7a0000)}
.bc{border:1px solid rgba(255,255,255,.18)}
.cg{margin:26px 4px 14px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);font-weight:700}
.bcd{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:12px 4px 0}
.bcd span{color:var(--mu);font-size:13px;flex:1}
.bcd .add{white-space:nowrap}
@media (prefers-reduced-motion:reduce){.bcw{opacity:1;transform:none;transition:none}.bc{transform:none!important}}
footer{text-align:center;color:var(--mu);font-size:12px;padding:10px 0 20px}
</style>
</head>
<body>
<main>
 <section class="hero">
  <h1>МАГАЗИН СОВЫ</h1>
  <p>Проверенные аккаунты и банковские карты. Промокод <b>SOVA10</b> даёт −10%</p>
  
 </section>
 <div class="tabs"><button class="on" data-tab="acc">Аккаунты</button><button data-tab="cards">Карты</button></div>
 <div id="catalog">
 <div class="chips" id="chips"></div>
 <div class="bar"><span id="cnt"></span><button id="sort">Сначала дешёвые ↑</button></div>
 <div id="list"></div>
 </div>
 <div id="cardsView"></div>
 <footer>Уникальные аккаунты, один покупатель на аккаунт<br>Выдача после оплаты в Telegram</footer>
</main>
<button id="cartbar"></button>
<div id="sheet"><div class="pane" id="pane"></div></div>
<script>
const MANAGER='HA_COBE'; // ← ник менеджера в Telegram без @
const PROMO={SOVA10:10,NY2027:10};
const CATS=[['all','Все'],['new','Новые'],['rev','С отзывами'],['old','Старые'],['biz','Магазины']];
const ICON={new:'✦',rev:'★',old:'◷',biz:'▣'};
const ACC=[
 {id:'Начало',t:'new',y:2026,rv:0,rt:0,p:750,d:'Свежий аккаунт, подтвержден по паспорту'},
 {id:'Легкое начало',t:'new',y:2026,rv:0,rt:0,p:1500,d:'Чистая история, без ограничений'},
 {id:'Профи',t:'rev',y:2025,rv:7,rt:5.0,p:2000,d:'7 отзывов, рейтинг 5.0'},
 {id:'Мажорчик',t:'rev',y:2024,rv:23,rt:4.9,p:2990,d:'23 отзыва, активные объявления'},
 {id:'Изи профит',t:'old',y:2021,rv:12,rt:4.8,p:4990,d:'Регистрация 2021, прогретый'},
 {id:'гретый',t:'old',y:2019,rv:41,rt:4.9,p:6990,d:'Живая история с 2019 года'},
 {id:'ИП/ООО',t:'biz',y:2023,rv:58,rt:4.9,p:8990,d:'Профиль магазина, 58 отзывов'},
 {id:'Действующий магазин',t:'biz',y:2022,rv:112,rt:5.0,p:14990,d:'Магазин с высоким рейтингом'},
 {id:'изи лиды',t:'rev',y:2023,rv:15,rt:4.7,p:2290,d:'15 отзывов, подходит для старта'},
 {id:'попробовать',t:'new',y:2026,rv:1,rt:5.0,p:500,d:'Один отзыв, свежая регистрация'}];
const RATE=82.15; // курс ЦБ РФ $→₽ на 14.11.2026; цены ниже в $, в рубли переводятся автоматически
const GROUPS={KZ:'🇰🇿 Банки Казахстана · KZ',RU:'🇷🇺 Банки России · RU',TJ:'🇹🇯 Банки Таджикистана · TJ',PL:'🇵🇱 Банки Польши · PL'};
const BANKS=[
 {g:'KZ',c:'kaspi',id:'Карта Kaspi',n:'KASPI',s:'Каспи',u:75},
 {g:'KZ',c:'home',id:'Карта Home',n:'HOME',s:'Хоум',u:65},
 {g:'KZ',c:'halyk',id:'Карта Halyk',n:'HALYK',s:'Халык',u:65},
 {g:'RU',c:'sber',id:'Карта Sberbank',n:'SBERBANK',s:'Сбербанк',u:80},
 {g:'RU',c:'tink',id:'Карта Tinkoff',n:'TINKOFF',s:'Т Банк',u:70},
 {g:'RU',c:'ozon',id:'Карта Ozon',n:'OZON',s:'Озон',u:60},
 {g:'RU',c:'alfa',id:'Карта Alfa',n:'ALFA',s:'Альфа',u:70},
 {g:'TJ',c:'alif',id:'Карта Alif',n:'ALIF BANK',s:'Алиф Банк',u:70},
 {g:'TJ',c:'esh',id:'Карта Eskhata',n:'ESKHATA',s:'Банк Эсхата',u:65},
 {g:'TJ',c:'mtb',id:'Карта MTB',n:'MTB BANK',s:'Мтб Банк',u:75},
 {g:'PL',c:'mil',id:'Карта Millennium',n:'MILLENNIUM',s:'Милениум',u:110},
 {g:'PL',c:'pko',id:'Карта PKO',n:'PKO',s:'ПКО',u:100},
 {g:'PL',c:'san',id:'Карта Santander',n:'SANTANDER',s:'Сантандер',u:90}];
BANKS.forEach(b=>b.p=Math.round(b.u*RATE/10)*10);
const KEY='ny_shop_v1';
let tab='acc',cat='all',asc=true,cart=[],disc=0,enter=true;
try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(x))cart=x.filter(i=>ACC.some(a=>a.id===i)||BANKS.some(b=>b.id===i))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(cart))}catch(e){}};
const tg=window.Telegram&&window.Telegram.WebApp;
if(tg){try{tg.ready();tg.expand()}catch(e){}}
const buzz=()=>{try{tg&&tg.HapticFeedback.impactOccurred('light')}catch(e){}};
const $=id=>document.getElementById(id);
const fmt=n=>n.toLocaleString('ru-RU')+' ₽';
const find=id=>ACC.find(a=>a.id===id)||BANKS.find(b=>b.id===id);
const lbl=a=>a.c?a.id:'Аккаунт '+a.id;
const total=()=>cart.reduce((s,id)=>s+(find(id)?find(id).p:0),0);


function render(){
 $('chips').innerHTML=CATS.map(c=>`<button class="chip ${cat===c[0]?'on':''}" data-c="${c[0]}">${c[1]}</button>`).join('');
 const L=ACC.filter(a=>cat==='all'||a.t===cat).sort((a,b)=>asc?a.p-b.p:b.p-a.p);
 $('cnt').textContent=`Найдено: ${L.length}`;
 $('sort').textContent=asc?'Сначала дешёвые ↑':'Сначала дорогие ↓';
 $('list').innerHTML=L.map((a,i)=>{
  const inC=cart.includes(a.id);
  return `<div class="card${enter?' enter':''}" style="animation-delay:${i*70}ms"><div class="top"><div class="av">${ICON[a.t]}</div><div class="m"><b>Аккаунт ${a.id}</b><small>${a.d}</small></div></div>
  <div class="tags"><span class="tag">с ${a.y} г.</span><span class="tag g">Телефон ✓</span>${a.rv?`<span class="tag s">★ ${a.rt} · ${a.rv} отз.</span>`:'<span class="tag">Без отзывов</span>'}</div>
  <div class="row"><div class="price">${fmt(a.p)}</div><button class="add ${inC?'in':''}" data-id="${a.id}">${inC?'В корзине ✓':'В корзину'}</button></div></div>`}).join('');
 const n=cart.length;
 $('cartbar').style.display=n?'flex':'none';
 $('cartbar').innerHTML=`<span>Корзина · ${n}</span><span>${fmt(total())}</span>`;
 syncCards();save();enter=false;
}
function syncCards(){document.querySelectorAll('.bcd .add').forEach(b=>{const i=cart.includes(b.dataset.id);b.classList.toggle('in',i);b.textContent=i?'В корзине ✓':'Купить'})}
function renderCards(){
 let h='',g='',i=0;
 BANKS.forEach(b=>{
  if(b.g!==g){g=b.g;h+=`<h3 class="cg">${GROUPS[g]}</h3>`}
  const inC=cart.includes(b.id);
  h+=`<div class="bcw"><div class="bc ${b.c}"><div class="l"><span class="nm">${b.n}</span><span class="chip2"></span></div><div class="num">•••• •••• •••• ${1000+(i*1337)%9000}</div><div class="ft"><span>${b.s}</span><span>VALID 12/30</span></div></div>
  <div class="bcd"><div><div class="price">${fmt(b.p)}</div><small style="color:var(--mu)">${b.s}</small></div><button class="add ${inC?'in':''}" data-id="${b.id}">${inC?'В корзине ✓':'Купить'}</button></div></div>`;i++});
 $('cardsView').innerHTML=h;
 io.disconnect();document.querySelectorAll('.bcw').forEach(e=>io.observe(e));tick();
}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in')}),{threshold:.15});
function tick(){
 if(tab!=='cards')return;
 document.querySelectorAll('.bc').forEach(el=>{
  const r=el.getBoundingClientRect(),p=Math.max(-1,Math.min(1,(r.top+r.height/2-innerHeight/2)/(innerHeight/2)));
  el.style.transform=`rotateX(${-p*24}deg) rotateY(${p*10}deg) scale(${1-Math.abs(p)*.08})`;
  el.style.setProperty('--sx',(50+p*50)+'%');el.style.setProperty('--sy',(20+p*40)+'%');
 });
}
addEventListener('scroll',tick,{passive:true});addEventListener('resize',tick);
function setTab(t){
 tab=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
 $('catalog').style.display=t==='acc'?'block':'none';$('cardsView').style.display=t==='cards'?'block':'none';
 scrollTo(0,0);render();if(t==='cards')renderCards();
}
function burst(x,y,em){for(let k=0;k<14;k++){const s=document.createElement('span');s.className='p';s.textContent=em[k%em.length];const a=Math.random()*6.28,d=50+Math.random()*80;s.style.cssText=`left:${x}px;top:${y}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d-30}px`;document.body.appendChild(s);setTimeout(()=>s.remove(),900)}}
function bump(id){const b=document.querySelector(`.add[data-id="${id}"]`);if(b)b.classList.add('pop');const c=$('cartbar');c.classList.remove('bump');void c.offsetWidth;c.classList.add('bump')}
function sheet(){
 const T=total(),D=Math.round(T*disc/100);
 $('pane').innerHTML=`<h2>Корзина</h2>`+(cart.length?cart.map(id=>{const a=find(id);return `<div class="it"><span>${lbl(a)}<br><small style="color:var(--mu)">${fmt(a.p)}</small></span><button data-rm="${id}">✕</button></div>`}).join('')+
 `<div class="promo"><input id="pi" placeholder="Промокод"><button id="pa">OK</button></div><div class="msg" id="pm">${disc?`Скидка ${disc}% применена`:''}</div>
 <div class="sum"><span>Итого</span><span>${fmt(T-D)}</span></div><button class="add" id="go" style="width:100%;padding:16px;font-size:16px">Оформить в Telegram</button>`:'<div class="empty">Пока пусто. Пока пусто</div>');
}
function checkout(){
 const T=total(),D=Math.round(T*disc/100);
 const txt='Привет! Хочу оформить заказ:\n'+cart.map(id=>`• ${lbl(find(id))} — ${fmt(find(id).p)}`).join('\n')+`\nИтого: ${fmt(T-D)}`+(disc?` (промокод −${disc}%)`:'');
 const url=`https://t.me/${MANAGER}?text=${encodeURIComponent(txt)}`;
 try{tg?tg.openTelegramLink(url):window.open(url,'_blank')}catch(e){}
 try{navigator.clipboard.writeText(txt)}catch(e){}
}
document.addEventListener('click',e=>{
 const t=e.target;
 if(t.dataset.tab){buzz();setTab(t.dataset.tab)}
 else if(t.dataset.c){cat=t.dataset.c;enter=true;buzz();render()}
 else if(t.id==='sort'){asc=!asc;enter=true;buzz();render()}
 else if(t.dataset.id){const i=cart.indexOf(t.dataset.id),r=t.getBoundingClientRect();if(i<0){cart.push(t.dataset.id);burst(r.left+r.width/2,r.top+r.height/2,['✦','◆','✧'])}else cart.splice(i,1);buzz();render();bump(t.dataset.id)}
 else if(t.closest('#cartbar')){sheet();$('sheet').classList.add('on')}
 else if(t.id==='sheet'){$('sheet').classList.remove('on')}
 else if(t.dataset.rm){cart=cart.filter(x=>x!==t.dataset.rm);render();sheet()}
 else if(t.id==='pa'){const c=$('pi').value.trim().toUpperCase();disc=PROMO[c]||0;sheet();if(disc)burst(innerWidth/2,innerHeight*.55,['✦','◆','✧']);$('pm').textContent=disc?`Скидка ${disc}% применена`:'Промокод не найден'}
 else if(t.id==='go'){burst(innerWidth/2,innerHeight*.75,['✦','◆','✧']);checkout()}
});
render();
</script>
</body>
</html>
